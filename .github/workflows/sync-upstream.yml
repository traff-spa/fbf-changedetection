name: Sync upstream

on:
  schedule:
    - cron: '0 3 * * 1'  # щопонеділка о 3:00
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/dgtlmoon/changedetection.io.git
          git fetch upstream
          git merge upstream/dev --no-edit || true
          git push origin fbf/config
