services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io
    container_name: changedetection
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./datastore:/datastore
    environment:
      - SALTED_PASS=${SALTED_PASS}
      - CD_API_KEY=${CD_API_KEY}
